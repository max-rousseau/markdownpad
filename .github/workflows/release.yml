name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # required to create the GitHub Release and upload assets

jobs:
  release-mac:
    runs-on: macos-14   # Apple Silicon runner (arm64)
    timeout-minutes: 60   # notarize step waits on Apple's queue and can take 5-30+ min on busy days
    environment: release   # gates secrets behind required-reviewer approval
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build renderer/main/preload bundles
        run: npm run build

      - name: Sign, notarize, publish
        env:
          # Auth for the GitHub Release upload (electron-builder reads GH_TOKEN)
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # Code-signing identity — base64-encoded .p12 + its password.
          # electron-builder picks these up from CSC_LINK + CSC_KEY_PASSWORD.
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}

          # Notarization (App-Specific Password flow)
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx electron-builder --mac --arm64 --publish always
